<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>AI HUB | منصة المساعدين الذكيين</title>
<link rel="stylesheet" href="/static/style.css?v=1.4.3">
<link rel="stylesheet" href="/static/chat.css?v=1.4.3">
</head>
<body><div class="shell">
<header class="topbar">
  <div class="brand"><div class="logo" aria-hidden="true">AI</div><div><div class="eyebrow" data-i18n="brand.eyebrow">AI HUB</div><h1>AI HUB</h1><p data-i18n="brand.subtitle"></p></div></div>
  <div class="topbar-controls">
    <div class="language-switch" role="group" data-i18n-aria-label="language.label" aria-label="لغة الواجهة">
      <button id="languageAR" type="button" lang="ar" dir="rtl" aria-pressed="true" class="active">العربية</button>
      <button id="languageEN" type="button" lang="en" dir="ltr" aria-pressed="false">English</button>
    </div>
    <div class="status"><span id="healthDot" class="dot" aria-hidden="true"></span><span id="healthText" role="status" data-i18n="health.checking"></span></div>
    <button id="headerLogoutBtn" class="secondary hidden" type="button" data-i18n="logout"></button>
  </div>
</header>
<section class="hero">
  <div class="hero-main"><div class="eyebrow" data-i18n="hero.eyebrow"></div><h2 data-i18n="hero.title"></h2><p data-i18n="hero.description"></p></div>
  <div class="hero-metric"><div class="metric-number" id="agentCount">13</div><div class="metric-label" data-i18n="hero.metric"></div><div class="metric-foot" id="runtimeLabel" data-i18n="health.modelChecking"></div></div>
</section>
<section class="capability-strip" data-i18n-aria-label="capabilities.label">
  <article class="capability-card"><span class="capability-icon" aria-hidden="true">01</span><div><strong data-i18n="capabilities.assistants"></strong><p data-i18n="capabilities.assistantsNote"></p></div></article>
  <article class="capability-card"><span class="capability-icon" aria-hidden="true">02</span><div><strong data-i18n="capabilities.news"></strong><p data-i18n="capabilities.newsNote"></p></div></article>
  <article class="capability-card"><span class="capability-icon" aria-hidden="true">03</span><div><strong data-i18n="capabilities.reports"></strong><p data-i18n="capabilities.reportsNote"></p></div></article>
  <article class="capability-card"><span class="capability-icon" aria-hidden="true">04</span><div><strong data-i18n="capabilities.archive"></strong><p data-i18n="capabilities.archiveNote"></p></div></article>
</section>
<p class="notice source-policy" data-i18n="sourcePolicy"></p>
<section id="accountOverview" class="account-overview hidden" data-i18n-aria-label="overview.label">
  <article><span data-i18n="overview.attempts"></span><strong id="dailyCount">—</strong><small id="dailyRemaining">—</small></article>
  <article><span data-i18n="overview.dailyCost"></span><strong id="dailyCost">—</strong><small id="dailyBudget">—</small></article>
  <article><span data-i18n="overview.monthlyCost"></span><strong id="monthlyCost">—</strong><small id="monthlyBudget">—</small></article>
  <article><span data-i18n="overview.configuration"></span><strong id="providerStatus">—</strong><small id="scheduleStatus">—</small></article>
</section>
<nav id="workspaceTabs" class="workspace-tabs hidden" role="tablist" data-i18n-aria-label="tabs.label">
  <button id="reportsTab" type="button" role="tab" aria-controls="reportsView" aria-selected="true" data-i18n="tabs.reports"></button>
  <button id="chatTab" type="button" role="tab" aria-controls="chatView" aria-selected="false" tabindex="-1" data-i18n="tabs.chat"></button>
</nav>
<div id="reportsView" role="tabpanel" aria-labelledby="reportsTab">
<main class="layout">
<aside class="panel">
  <div class="section-head"><h3 data-i18n="access.title"></h3><span class="hint" data-i18n="access.eyebrow"></span></div>
  <div id="loginBox" class="login-box">
    <h4 data-i18n="login.title"></h4>
    <div class="field"><label for="username" data-i18n="login.username"></label><input id="username" dir="auto" autocomplete="username" data-i18n-placeholder="login.usernamePlaceholder"></div>
    <div class="field"><label for="password" data-i18n="login.password"></label><input id="password" type="password" dir="auto" autocomplete="current-password" data-i18n-placeholder="login.passwordPlaceholder"></div>
    <button id="loginBtn" class="primary full" type="button" data-i18n="login.button"></button>
    <div class="small-note" data-i18n="login.privacy"></div>
  </div>
  <div id="sessionBox" class="hidden"><div class="notice good" data-i18n="login.verified"></div><button id="logoutBtn" class="secondary full session-logout" type="button" data-i18n="logout"></button></div>
  <div id="loginNotice" class="notice" role="status" data-i18n="login.prompt"></div>
  <div id="agentSection" class="hidden">
    <div class="section-head"><h3 data-i18n="agents.title"></h3><span class="hint" id="listCount">0 / 13</span></div>
    <input id="search" class="search" type="search" data-i18n-placeholder="agents.search" data-i18n-aria-label="agents.searchLabel">
    <div id="agentList" class="agent-list"></div>
  </div>
</aside>
<section class="panel">
  <div id="welcome" class="empty"><div><div class="empty-icon" aria-hidden="true">✳</div><strong data-i18n="welcome.title"></strong><p data-i18n="welcome.description"></p></div></div>
  <div id="workArea" class="hidden">
    <div class="workspace-top"><div class="agent-title"><div id="selectedNum" class="agent-num">01</div><div><h2 id="selectedName"></h2><p id="selectedId" dir="ltr"></p></div></div><span id="selectedStatus" class="pill warn" data-i18n="agents.waiting"></span></div>
    <p id="selectedDescription" class="agent-description"></p><div class="meta" id="skillTags"></div>
    <div class="runner">
      <div class="runner-head"><h3 data-i18n="task.title"></h3><span data-i18n="task.eyebrow"></span></div>
      <div class="field"><label for="task" data-i18n="task.label"></label><textarea id="task" dir="auto" maxlength="8000" aria-describedby="newsCoverageHint reportLanguageHint" data-i18n-placeholder="task.placeholder"></textarea><small id="newsCoverageHint" class="hint" data-i18n="task.coverage"></small><small id="reportLanguageHint" class="hint" data-i18n="task.languageNote"></small></div>
      <div class="examples"><button type="button" id="worldNewsPreset" class="textbutton" data-i18n="task.worldPreset"></button><button type="button" id="iranNewsPreset" class="textbutton" data-i18n="task.iranPreset"></button></div>
      <div class="actions"><button id="runBtn" class="primary" type="button" data-i18n="task.run"></button><button id="clearBtn" class="secondary" type="button" data-i18n="task.clear"></button><span class="hint" id="runHint" data-i18n="task.runHint"></span></div>
    </div>
    <div id="responsePanel" class="response hidden">
      <div class="response-head"><strong id="responseHeading" data-i18n="response.title"></strong><div class="actions"><button id="downloadBtn" class="textbutton hidden" type="button" data-i18n="response.download"></button><button id="copyBtn" class="textbutton" type="button" data-i18n="response.copy"></button></div></div>
      <div id="responseBody" class="response-body" dir="auto" role="region" aria-labelledby="responseHeading"></div>
      <details class="usage-details"><summary data-i18n="usage.title"></summary><div id="usage" class="usage"></div></details>
    </div>
    <div id="runNotice" class="notice hidden" role="status"></div>
  </div>
</section>
</main>
<section id="management" class="management hidden" data-i18n-aria-label="management.label">
  <div class="management-head"><div><h2 data-i18n="management.title"></h2><p data-i18n="management.description"></p></div><button id="refreshDashboard" class="secondary" type="button" data-i18n="management.refresh"></button></div>
  <div id="dashboardNotice" class="notice hidden" role="status"></div>
  <div class="ops-layout">
    <section class="panel archive-panel">
      <div class="section-head"><h3 data-i18n="archive.title"></h3><span id="archivePageLabel" class="hint"></span></div>
      <div id="archiveList" class="archive-list"><p class="hint" data-i18n="archive.initial"></p></div>
      <div class="archive-pagination"><button id="archivePrev" class="secondary" type="button" disabled data-i18n="archive.newer"></button><button id="archiveNext" class="secondary" type="button" disabled data-i18n="archive.older"></button></div>
      <p class="small-note" data-i18n="archive.costNote"></p>
    </section>
    <section class="panel schedule-panel">
      <div class="section-head"><h3 data-i18n="schedule.title"></h3><span class="pill" data-i18n="schedule.dubai"></span></div>
      <div id="schedulerNotice" class="notice"></div>
      <form id="scheduleForm">
        <div class="field"><label for="scheduleName" data-i18n="schedule.name"></label><input id="scheduleName" dir="auto" maxlength="120" data-i18n-placeholder="schedule.namePlaceholder"></div>
        <div class="field"><label for="scheduleAgent" data-i18n="schedule.agent"></label><select id="scheduleAgent" required></select></div>
        <div class="field"><label for="scheduleTask" data-i18n="schedule.task"></label><textarea id="scheduleTask" dir="auto" maxlength="8000" required data-i18n-placeholder="schedule.taskPlaceholder"></textarea></div>
        <div class="field"><label for="scheduleLanguage" data-i18n="schedule.language"></label><select id="scheduleLanguage" required><option value="ar" data-i18n="language.arabic"></option><option value="en" data-i18n="language.english"></option></select></div>
        <div class="field"><label for="scheduleTimes" data-i18n="schedule.times"></label><input id="scheduleTimes" dir="ltr" required placeholder="08:00, 13:00, 18:00" aria-describedby="timesHint"><small id="timesHint" class="hint" data-i18n="schedule.timesHint"></small></div>
        <label class="checkbox-row"><input id="scheduleEnabled" type="checkbox"><span data-i18n="schedule.enableLabel"></span></label>
        <div class="actions"><button id="saveSchedule" class="primary" type="submit" data-i18n="schedule.save"></button><button id="cancelScheduleEdit" class="secondary hidden" type="button" data-i18n="schedule.cancel"></button></div>
      </form>
      <div id="scheduleNotice" class="notice hidden" role="status"></div><div id="scheduleList" class="schedule-list"></div>
    </section>
  </div>
</section>
</div>
<section id="chatView" class="hidden" role="tabpanel" aria-labelledby="chatTab"><div id="chatRoot"></div></section>
<footer class="footer"><span data-i18n="footer.brand"></span><span data-i18n="footer.note"></span></footer>
</div>
<script src="/static/i18n.js?v=1.4.3" defer></script>
<script src="/static/chat.js?v=1.4.3" defer></script>
<script src="/static/app.js?v=1.4.3" defer></script>
</body>
</html>
